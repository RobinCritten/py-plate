repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff Check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff Format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: MyPy
        entry: uv run mypy
        language: system
        types: [python]
      - id: pytest
        name: PyTest
        entry: uv run pytest -v
        language: system
        pass_filenames: false
        always_run: true
